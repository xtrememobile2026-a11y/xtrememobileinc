    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <img src="https://res.cloudinary.com/dtw3qx4qq/image/upload/v1786291062/LogoXtremeMobile_frev1t-removebg-preview_hjzfib.png" alt="XTREME MOBILE" class="loading-logo">
        <p class="mt-3 text-light fw-bold">Cargando...</p>
    </div>

    <!-- ============ LOGIN PAGE ============ -->
    <div id="loginPage" class="page">
        <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center login-bg">
            <div class="row w-100 justify-content-center">
                <div class="col-11 col-sm-8 col-md-6 col-lg-4">
                    <div class="card login-card border-0 shadow-lg">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-4">
                                <div class="company-logo mx-auto mb-3">
                                    <img src="https://res.cloudinary.com/dtw3qx4qq/image/upload/v1786291062/LogoXtremeMobile_frev1t-removebg-preview_hjzfib.png" alt="XTREME MOBILE">
                                </div>
                                <h3 class="fw-bold text-danger">XTREME MOBILE</h3>
                                <p class="text-muted small">Sistema de Inventario</p>
                            </div>

                            <!-- Login Form -->
                            <form id="loginForm">
                                <div id="loginError" class="alert alert-danger d-none"></div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small">Usuario</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" id="loginUsername" placeholder="Ingrese su usuario" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold small">Contraseña</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control" id="loginPassword" placeholder="Ingrese su contraseña" required>
                                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold mb-3">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>INGRESAR
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
